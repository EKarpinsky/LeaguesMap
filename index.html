<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="description" content="Interactive map of every OSRS Demonic Pacts League task, pinned to its location in Gielinor." />
    <!-- The map is delivered as a Leaflet tile pyramid (see
         scripts/tile-map-image.py). The visible viewport at the
         initial fit-to-world zoom is only 4 tiles ≈ 30 KB total, so
         a single-image preload would actually waste bandwidth on
         tiles outside the viewport. Leaflet kicks off tile fetches
         the moment MapView mounts. -->

    <script type="module" src="/src/main.tsx"></script>
